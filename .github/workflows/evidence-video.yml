name: Evidence video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/evidence-video/**'
      - '.github/workflows/evidence-video.yml'

permissions:
  contents: read

concurrency:
  group: evidence-video-release
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/evidence-video
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Render evidence preview
        run: |
          mkdir -p out
          render() {
            if ! npx remotion "$@" > out/render.log 2>&1; then
              cat out/render.log
              python3 -c 'from pathlib import Path; text=Path("out/render.log").read_text()[-12000:]; print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
              exit 1
            fi
            cat out/render.log
          }
          render still EvidenceReplay out/before-preview.png --frame=180
          render still EvidenceReplay out/after-preview.png --frame=480
          render still EvidenceReplay out/result-preview.png --frame=780
          render render EvidenceReplay out/behavectl-evidence-preview.mp4 --concurrency=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: behavectl-evidence-preview
          path: docs/evidence-video/out/
          retention-days: 14
      - name: Publish preview media to alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v0.1.0-alpha.1 \
            out/before-preview.png \
            out/after-preview.png \
            out/result-preview.png \
            out/behavectl-evidence-preview.mp4 \
            --clobber
