name: CI

on:
  push:
    branches: ["main"]
    tags: ["v0.1.0-alpha.2"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: npm test

      - name: CLI smoke
        run: node src/cli/behavectl.mjs --help

  release-gate:
    name: Release gate · Ubuntu · Node 22
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Full deterministic release gate
        run: npm run release:check

      - name: npm publish shape
        run: npm publish --dry-run --access public

  publish-patch:
    name: Publish GitHub maintenance alpha
    if: github.ref == 'refs/tags/v0.1.0-alpha.2'
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build version-matched package and notes
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if ('v'+p.version!==process.env.GITHUB_REF_NAME) process.exit(1);"
          mkdir release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum behavectl-0.1.0-alpha.2.tgz > SHA256SUMS
          cd ..
          python3 - <<'PYNOTES'
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text().split('## 0.1.0-alpha.2 — Studio first-use fixes\n', 1)[1].split('\n## ', 1)[0]
          text += '\n\nDownload the tarball and verify its SHA-256 against SHA256SUMS.\n\n```sh\nnpm install --prefix ./local-runtime --ignore-scripts --no-audit --no-fund ./behavectl-0.1.0-alpha.2.tgz\n./local-runtime/node_modules/.bin/behavectl --version\n```\n'
          text += '\nSHA-256:\n```text\n' + Path('release-assets/SHA256SUMS').read_text() + '```\n'
          Path('release-assets/notes.md').write_text(text)
          PYNOTES
      - name: Publish new pre-release without replacing alpha.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/behavectl-0.1.0-alpha.2.tgz release-assets/SHA256SUMS --verify-tag --prerelease --title "Behavectl v0.1.0-alpha.2 — Studio first-use fixes" --notes-file release-assets/notes.md
