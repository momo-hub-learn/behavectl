<text x="48" y="109" font-size="38" font-weight="700" fill="#f5f7ff">Fix the source. Keep the correction.</text>
<text x="48" y="146" font-size="20" fill="#b5c1d6">A generated file looked fixed. Its source still contained the bug.</text>
