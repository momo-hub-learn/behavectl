<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Behavectl: a rule that fixed the source of the bug</title>
<desc id="desc">Recorded Codex certification: without the rule one of three complete tasks passed; with the rule all three passed. In the first pair the baseline changed only the generated file, while the candidate updated the source and regenerated the output. One challenge, three pairs, six real tasks. Static evidence summary.</desc>
